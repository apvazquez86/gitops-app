name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/apvazquez86/gitops-app
  GITOPS_REPO: apvazquez86/gitops

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  security:
    # Third-party scanner: no secrets and read-only permissions.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: gitops-app:scan
      - name: Scan the image for vulnerabilities
        # Pinned by commit: the trivy-action tags were hijacked in March 2026
        # (GHSA-69fq-xp46-6x23).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: gitops-app:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - name: Scan the repo for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: '0'

  build:
    # Only commits that reach main produce an image.
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          # The kind cluster runs on Apple Silicon (arm64); amd64 keeps the
          # image usable on standard runners and clusters.
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote:
    # Opens a PR in the deploy repo with the new tag for dev; merging it is
    # the manual approval step before Argo CD deploys. Prod is promoted
    # separately from the deploy repo.
    needs: build
    runs-on: ubuntu-latest
    env:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
      TAG: ${{ needs.build.outputs.tag }}
      VALUES_FILE: chart/values-dev.yaml
    steps:
      - name: Check token
        if: env.GITOPS_TOKEN == ''
        run: echo "::warning::El secret GITOPS_TOKEN no esta configurado; no se abre el PR en ${GITOPS_REPO}."
      - uses: actions/checkout@v7
        if: env.GITOPS_TOKEN != ''
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
      - name: Update image tag and open PR
        if: env.GITOPS_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          branch="release/dev/gitops-app-${TAG}"
          # yq ships with the GitHub-hosted Ubuntu runners and keeps comments.
          yq -i '.image.tag = strenv(TAG)' "$VALUES_FILE"
          if git diff --quiet; then
            echo "${VALUES_FILE} ya apunta a ${TAG}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "Deploy gitops-app ${TAG} to dev"
          git push origin "$branch"
          gh pr create --repo "$GITOPS_REPO" --base main --head "$branch" \
            --title "Deploy gitops-app ${TAG} to dev" \
            --body "Actualiza \`image.tag\` en \`${VALUES_FILE}\` a \`${TAG}\` (\`${IMAGE}:${TAG}\`).

          Commit de origen: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          Al mergear este PR, Argo CD despliega la nueva version en dev. Prod se promueve aparte."
